[package]
name = "co5300-registers"
description = "A typed map of the Chipone CO5300 AMOLED display controller commands"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal", "co5300", "amoled", "display", "registers"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
defmt = ["dep:defmt"]

[dependencies]
bitfield-struct.workspace = true
defmt = { workspace = true, optional = true }
hardware-registers.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/co5300/releases/tag/v{{version}}", exactly = 1 },
]
